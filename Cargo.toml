[package]
name = "fame"
version = "0.3.9"
edition = "2021"
description = "Fame — Facade for Agent Memory over PDT"
license = "MIT OR Apache-2.0"
authors = ["Podtan Team"]
repository = "https://github.com/Podtan/fame"
readme = "README.md"
keywords = ["memory", "agents", "cedar", "api-server", "authorization"]
categories = ["authentication", "database-implementations", "web-programming::http-server"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
utoipa = "5"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
thiserror = "2"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
figment = { version = "0.10", features = ["toml", "env"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
pep = { version = "0.5", features = ["cedar", "axum", "config"] }
cedar-policy = "4"
futures = "0.3"

# Content hashing (identity content updates echo old→new sha256)
sha2 = "0.10"
